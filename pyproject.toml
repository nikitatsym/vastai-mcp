[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vastai-mcp"
version = "1.0.0"
description = "MCP server for Vast.ai GPU marketplace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
keywords = ["mcp", "vastai", "gpu", "cloud", "model-context-protocol", "claude", "ai"]

[project.scripts]
vastai-mcp = "vastai_mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.14",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
markers = ["integration: goes to the live vast.ai API"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 100
